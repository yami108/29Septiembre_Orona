<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Yamileht Orona Rodriguez</title>
    <!-- Carga de tipografía elegante desde Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;600&family=Playfair+Display:wght@600&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --bg-color: #0f172a;        /* Azul noche profundo */
            --card-bg: #1e293b;        /* Pizarra oscuro */
            --accent-gold: #d4af37;     /* Dorado elegante */
            --accent-hover: #f3e5ab;    /* Dorado claro para interactividad */
            --text-primary: #f8fafc;    /* Blanco suave */
            --text-secondary: #94a3b8;  /* Gris claro */
            --border-color: #334155;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-primary);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .card {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 48px 40px;
            max-width: 480px;
            width: 100%;
            text-align: center;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.3), 0 8px 10px -6px rgba(0, 0, 0, 0.3);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }

        .card:hover {
            transform: translateY(-4px);
            box-shadow: 0 25px 30px -5px rgba(0, 0, 0, 0.4), 0 12px 15px -6px rgba(0, 0, 0, 0.4);
        }

        .subtitle {
            text-transform: uppercase;
            font-size: 0.75rem;
            letter-spacing: 0.15em;
            color: var(--accent-gold);
            font-weight: 600;
            margin-bottom: 12px;
            display: block;
        }

        h1 {
            font-family: 'Playfair Display', serif;
            font-size: 2.25rem;
            font-weight: 600;
            color: var(--text-primary);
            margin-bottom: 16px;
            line-height: 1.2;
        }

        p {
            color: var(--text-secondary);
            font-size: 0.95rem;
            margin-bottom: 32px;
            line-height: 1.5;
        }

        /* Contenedor principal de los botones para dar espacio uniforme */
        .button-container {
            display: flex;
            flex-direction: column;
            gap: 16px; /* Ajusta este valor si deseas más o menos espacio entre ellos */
        }

        .btn-link {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            width: 100%; /* Hace que todos los botones midan el mismo ancho */
            background-color: transparent;
            color: var(--accent-gold);
            border: 1px solid var(--accent-gold);
            padding: 12px 28px;
            border-radius: 8px;
            text-decoration: none;
            font-weight: 600;
            font-size: 0.9rem;
            letter-spacing: 0.025em;
            transition: all 0.25s ease;
        }

        .btn-link:hover {
            background-color: var(--accent-gold);
            color: #0f172a;
            box-shadow: 0 4px 14px rgba(212, 175, 55, 0.25);
        }

        .btn-link svg {
            width: 16px;
            height: 16px;
            fill: currentColor;
            transition: transform 0.25s ease;
        }

        .btn-link:hover svg {
            transform: translateX(4px);
        }
    </style>
</head>
<body>

        <span class="subtitle">Software Design Practices</span>
        <h1>Hello</h1>

                </svg>
            </a>

            <a class="btn-link" href="C:\UTD\4\topicos\practices\diagram.html">

                <svg viewBox="0 0 20 20">
                    <path d="M10.293 3.293a1 1 0 011.414 0l6 6a1 1 0 010 1.414l-6 6a1 1 0 01-1.414-1.414L14.586 11H3a1 1 0 110-2h11.586l-4.293-4.293a1 1 0 010-1.414z"/>
                </svg>
            </a>

            <a class="btn-link" href="C:\UTD\4\topicos\practices\diagram_custommer.html">

        </div>
    </main>

</body>
</html>
